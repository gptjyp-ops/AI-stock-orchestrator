name: Stock momentum report

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "config.json"
      - "requirements.txt"
      - ".github/workflows/stock-report.yml"
  schedule:
    # GitHub cron is UTC. These are 08:00, 14:00, 16:30 KST on Korean weekdays.
    - cron: "0 23 * * 0-4"
    - cron: "0 5 * * 1-5"
    - cron: "30 7 * * 1-5"

permissions:
  contents: write

concurrency:
  group: stock-report
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Generate report
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
        run: python src/report.py
      - name: Commit updated dashboard
        run: |
          git config user.name "stock-report-bot"
          git config user.email "stock-report-bot@users.noreply.github.com"
          git add docs reports LATEST.md
          git diff --cached --quiet || git commit -m "report: automatic market update"
          git push
